<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Oscar Berntsson</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Oscar Berntsson</a>
      <nav class="site-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="blog.html">Blog</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Blog</h1>
    <p class="post-status" id="loading-status">Loading posts&hellip;</p>
    <ul class="post-list" id="post-list"></ul>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Oscar Berntsson</p>
    </div>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <script src="js/main.js"></script>
  <script src="js/blog.js"></script>
  <script>
    // Hide the loading status once the list has content.
    var observer = new MutationObserver(function () {
      document.getElementById("loading-status").style.display = "none";
    });
    observer.observe(document.getElementById("post-list"), { childList: true });
  </script>
</body>
</html>
